name: Regression tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check app/static/app.js
      - run: node --check app/static/model-settings.js
      - run: node --check app/static/eligibility.js
      - run: node --check app/static/major-catalog.js
      - run: node --test tests/frontend.test.cjs tests/model-settings.test.cjs tests/eligibility.test.cjs tests/major-catalog.test.cjs
